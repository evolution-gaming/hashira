
updates.pin = [
  # pin Scala 2 to Scala 2.13.x
  {groupId = "org.scala-lang", artifactId = "scala-library", version = "2.13."},

  # pin Scala 3 to Scala 3.3.x LTS
  {groupId = "org.scala-lang", artifactId = "scala3-library", version = "3.3."},

  # https://github.com/classgraph/classgraph/releases#release-classgraph-5.0.0
  # pin classgraph to 5.x until we move to JDK 25 LTS
  {groupId = "io.github.classgraph", version = "5."},

  # pin Cassandra driver 3.x so we do not get updates for a fluke 4.x version with old
  # coordinates
  {groupId = "com.datastax.cassandra", artifactId = "cassandra-driver-core", version = "3."},
]
