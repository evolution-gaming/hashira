# MigratorParams config data class is generated using ConfigClassGenPlugin.
# Check out ConfigClassGenPlugin scaladoc for more info about schema format.
#
# Features:
# - adding new fields preserves the bincompat
# - nice toString with named values
# - autogenerated method for typesafe config reading
# - flat structure, no nesting
# - all fields must have default values and be documented

doc = "Parameters for [[Migrator]] and its components"

# additional imports go here:
#   imports = ["scala.concurrent.duration.*"]
imports = []

# Field definition:
# - `type` is a Scala type literal, goes as-is into the generated code
#   - supported types: String, Boolean, Int, Long, Double, `java.time.Duration` and FiniteDuration
# - `default` is a Scala value expression literal, goes as-is into the generated code
# - `doc` is a scaladoc string used for the @param, could be multiline with triple-quote HOCON syntax
fields {
  appliedMigrationsTable {
    type = String
    default = """"applied_migrations""""
    doc = "Name of the table storing applied migrations, located in the keyspace being migrated."
  }

  consistencyLevel {
    type = String
    default = """"QUORUM""""
    doc = """
      Consistency level of all the migration CQL statements executed during migration.
      Must be a constant name of the driver consistency level enum, e.g. `ONE`.
    """
  }

  ignoreMissingMigrations {
    type = Boolean
    default = false
    doc = """
      If true, applied migrations missing in the migration set are logged instead of failing
      with [[AppliedMigrationsMissingException]].
    """
  }

  createAppliedMigrationsTableIfMissing {
    type = Boolean
    default = true
    doc = "If true, [[Migrator]] creates the applied migrations table if it doesn't exist."
  }

  migrationFileExtension {
    type = String
    default = """"cql""""
    doc = "Migration file extension filter, without the dot, for the [[MigrationSetLoader]] implementations"
  }

  allowEmptyMigrationSet {
    type = Boolean
    default = false
    doc = """
      If true, [[Migrator]] does not fail if [[MigrationSetLoader]] returns an empty set.
      Please note that, if loading from classpath, path misconfiguration results in an empty
      migration set loaded.
    """
  }
}
