# Additional Cassandra driver settings for Driver4SupportTckSpec
datastax-java-driver {
  basic.request {
    # the default 2 seconds might be not enough for schema changes on a slow CI machine
    timeout = 30 seconds
  }

  # disable schema metadata update to speed up DDL statements - otherwise each waits
  # for schema update debounce (1 second by default)
  # https://apache.github.io/cassandra-java-driver/4.19.0/core/metadata/schema/#enablingdisabling
  advanced.metadata.schema.enabled = false
}
