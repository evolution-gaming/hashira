# Additional Cassandra driver settings for Driver4SupportTckSpec
datastax-java-driver {
  basic.request {
    # the default 2 seconds might be not enough for schema changes on a slow CI machine
    timeout = 30 seconds
  }

  advanced.metadata.schema.debouncer {
    # a schema change request completes only after the debounced schema metadata refresh,
    # the default 1 second debouncer window makes the TCK several times slower
    window = 0 seconds
  }
}
