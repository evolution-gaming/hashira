name: ci

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  ci-build:
    uses: evolution-gaming/scala-github-actions/.github/workflows/ci.yml@999c04ccae0d79a8a0c12ed7d71136762b2ae8c1 # v7.1.0
    with:
      # if changing binary Scala versions here, change in the build.sbt as well
      scala_versions: '["2.13.x", "3.x"]'
      java_version: 17
