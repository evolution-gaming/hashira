name: release

on:
  push:
    tags: [ "v*" ]

# deleting the release tag and creating the GitHub release both need write access
permissions:
  contents: write

# run only one release action at a time for the repo, wait for the previous to finish before running another one
concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}
  # by default only one run can be pending, an older pending run gets cancelled and leaves its tag behind
  queue: max

jobs:
  publish:
    runs-on: ubuntu-latest
    # a timed out job is cancelled, which deletes the release tag, instead of hanging for the default 6 hours
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetch all history for all branches and tags - just in case it's all necessary for ci-release.
          # Tags are needed for versionPolicyCheck binary and source compat checks.
          fetch-depth: 0
      - uses: coursier/cache-action@95e5b1029b6b86e7bac033ee44a0697d8a527d2d # v8.1.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version-file: .java-version
          distribution: temurin
          cache: sbt
      - uses: sbt/setup-sbt@ecad189dd245444b9ae0a0cd5922fd938b88906f # v1.5.12
      # sbt ci-release doesn't verify the build, need to do it explicitly
      - name: sbt build
        run: sbt clean build
      - run: sbt ci-release
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}

      - name: delete release tag if failed
        if: failure() || cancelled()
        run: git push --delete origin ${{ github.ref_name }}

      - name: publish release notes
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
        run: |
          gh release create "$tag" \
              --repo="$GITHUB_REPOSITORY" \
              --title="v${tag#v}" \
              --generate-notes
